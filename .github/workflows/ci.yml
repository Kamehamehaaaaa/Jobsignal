name: CI

# Run on every push and PR to main, plus manual trigger
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Run test suite
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Core deps needed to import every module under test.
          # Spark/torch are intentionally excluded — see note below.
          pip install confluent-kafka google-auth google-auth-oauthlib \
                      google-auth-httplib2 requests python-dotenv \
                      google-api-python-client pytest pytest-cov \
                      spacy mlflow click
          python -m spacy download en_core_web_sm

      - name: Run tests with coverage
        run: |
          pytest tests/ -v --cov=. --cov-report=term-missing --cov-report=xml
        env:
          PYTHONPATH: ${{ github.workspace }}
          # Dummy values so config/env-reading code doesn't crash in CI
          KAFKA_BOOTSTRAP_SERVERS: localhost:9092
          GMAIL_USER_EMAIL: ci-test@example.com
          GMAIL_CREDENTIALS_PATH: secrets/gmail_credentials.json
          GMAIL_TOKEN_PATH: secrets/gmail_token.json

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 14

  lint:
    name: Lint check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff (non-blocking)
        run: ruff check . --exit-zero